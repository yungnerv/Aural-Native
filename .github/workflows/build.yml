name: Build Aural Native
on:
  push:
    branches: [main]
    paths: ['Aural/**', 'Tests/**', 'Scripts/**', 'project.yml', 'VERSION', 'CHANGELOG.md', '.github/workflows/build.yml']
  pull_request:
    branches: [main]
    paths: ['Aural/**', 'Tests/**', 'Scripts/**', 'project.yml', 'VERSION', 'CHANGELOG.md', '.github/workflows/build.yml']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a downloadable unsigned prerelease'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 50
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Preflight build scripts and packaging tests
        shell: bash
        run: |
          bash -n Scripts/build.sh
          bash -n Scripts/test.sh
          bash -n Scripts/toolchain.sh
          bash -n Scripts/simulator.sh
          python3 -m unittest discover -s Tests -p 'test_*.py' -v
      - name: Validate version and run model tests
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\r\n' < VERSION)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          bash Scripts/test.sh
      - name: Compile and package unsigned IPA
        id: device_build
        run: bash Scripts/build.sh
      - name: Simulator integration and launch tests
        run: bash Scripts/simulator.sh iPhone
      - name: iPad simulator launch test
        if: ${{ !cancelled() && steps.device_build.outcome == 'success' }}
        run: bash Scripts/simulator.sh iPad
      - name: Upload simulator results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Aural-simulator-results-${{ github.run_number }}
          path: AuralTests-*.xcresult
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload simulator screenshots
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Aural-screenshots-${{ github.run_number }}
          path: |
            screenshots/**/*.png
            screenshots/**/manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Aural-Native-${{ steps.version.outputs.version }}-build-${{ github.run_number }}
          path: |
            output/*.ipa
            output/SHA256SUMS.txt
            output/BUILD.txt
          if-no-files-found: error
          retention-days: 14
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Aural-Native-${{ needs.build.outputs.version }}-build-${{ github.run_number }}
          path: output
      - name: Publish unsigned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          (cd output && sha256sum -c SHA256SUMS.txt)
          TAG="v${APP_VERSION}-build-${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.'
            exit 1
          fi
          printf 'Unsigned IPA for personal signing. Not an App Store release. Physical device testing is pending.\n\n' > release-notes.txt
          cat output/BUILD.txt CHANGELOG.md >> release-notes.txt
          gh release create "$TAG" output/*.ipa output/SHA256SUMS.txt output/BUILD.txt --target "$GITHUB_SHA" --prerelease --title "Aural Native $APP_VERSION (build $GITHUB_RUN_NUMBER)" --notes-file release-notes.txt
