name: Build Aural Native
on:
  push:
    branches: [main]
    paths: ['Aural/**', 'Tests/**', 'project.yml', 'VERSION', 'CHANGELOG.md', '.github/workflows/build.yml']
  pull_request:
    branches: [main]
    paths: ['Aural/**', 'Tests/**', 'project.yml', 'VERSION', 'CHANGELOG.md', '.github/workflows/build.yml']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a downloadable unsigned prerelease'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate version and run model tests
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\r\n' < VERSION)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          swiftc Aural/Models/Track.swift Tests/main.swift -o "$RUNNER_TEMP/aural-tests"
          "$RUNNER_TEMP/aural-tests"
      - name: Compile and package unsigned IPA
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodebuild -version
          xcodegen generate
          xcodebuild -project Aural.xcodeproj -scheme Aural -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/DerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build
          APP="$PWD/DerivedData/Build/Products/Release-iphoneos/Aural.app"
          test -f "$APP/Aural"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")" = 'local.aural.player'
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")" = "$APP_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")" = "$GITHUB_RUN_NUMBER"
          mkdir -p output/Payload
          ditto "$APP" output/Payload/Aural.app"
          cd output
          IPA="Aural-${APP_VERSION}-build-${GITHUB_RUN_NUMBER}-unsigned.ipa"
          zip -qry "$IPA" Payload
          unzip -tq "$IPA"
          shasum -a 256 "$IPA" > SHA256SUMS.txt
          printf 'Version: %s\nBuild: %s\nCommit: %s\nUnsigned: yes\n' "$APP_VERSION" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" > BUILD.txt
          cat BUILD.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Aural-Native-${{ steps.version.outputs.version }}-build-${{ github.run_number }}
          path: |
            output/*.ipa
            output/SHA256SUMS.txt
            output/BUILD.txt
          if-no-files-found: error
          retention-days: 14
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Aural-Native-${{ needs.build.outputs.version }}-build-${{ github.run_number }}
          path: output
      - name: Publish unsigned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          (cd output && sha256sum -c SHA256SUMS.txt)
          TAG="v${APP_VERSION}-build-${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.'
            exit 1
          fi
          printf 'Unsigned IPA for personal signing. Not an App Store release. Physical device testing is pending.\n\n' > release-notes.txt
          cat output/BUILD.txt CHANGELOG.md >> release-notes.txt
          gh release create "$TAG" output/*.ipa output/SHA256SUMS.txt output/BUILD.txt --target "$GITHUB_SHA" --prerelease --title "Aural Native $APP_VERSION (build $GITHUB_RUN_NUMBER)" --notes-file release-notes.txt
