name: Build Aural Native
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Generate and compile native app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Native/Aural/Assets.xcassets/AppIcon.appiconset
          cd Native
          cat > Aural/Assets.xcassets/AppIcon.appiconset/Contents.json <<'AURAL_SOURCE'
          {"images": [{"filename": "icon.png", "idiom": "universal", "platform": "ios", "size": "1024x1024"}], "info": {"author": "xcode", "version": 1}}
          AURAL_SOURCE
          python3 - <<'AURAL_ICON'
          import base64, pathlib
          pathlib.Path('Aural/Assets.xcassets/AppIcon.appiconset/icon.png').write_bytes(base64.b64decode(''))
          AURAL_ICON
          cat > Aural/Assets.xcassets/Contents.json <<'AURAL_SOURCE'
          {"info": {"author": "xcode", "version": 1}}
          AURAL_SOURCE
          cat > Aural/Aural.swift <<'AURAL_SOURCE'
          import SwiftUI
          import AVFoundation
          import MediaPlayer
          import UniformTypeIdentifiers
          import Combine
          import UIKit
          import ImageIO
          
          struct Track: Codable, Identifiable, Hashable {
              var id = UUID()
              var file: String
              var title: String
              var artist: String
              var album: String
              var duration: Double
              var favorite = false
              var artwork: String? = nil
              var format: String { URL(fileURLWithPath: file).pathExtension.uppercased() }
          }
          
          @MainActor final class PlaybackClock: ObservableObject {
              @Published var elapsed = 0.0
              @Published var duration = 0.0
          }
          
          @MainActor final class MusicStore: ObservableObject {
              @Published var tracks: [Track] = []
              @Published var currentID: UUID?
              @Published var playing = false
              let clock = PlaybackClock()
              var elapsed: Double { get { clock.elapsed } set { if clock.elapsed != newValue { clock.elapsed = newValue } } }
              var duration: Double { get { clock.duration } set { if clock.duration != newValue { clock.duration = newValue } } }
              @Published var importing = false
              @Published var message: String?
              @Published var shuffle = false
              @Published var repeatOne = false
              private let player = AVPlayer()
              private var queue: [UUID] = []
              private var timeObserver: Any?
              private var endObserver: NSObjectProtocol?
              private var stateObserver: NSKeyValueObservation?
              private var itemObserver: NSKeyValueObservation?
              private var failureObserver: NSObjectProtocol?
              private let root: URL
              private let fm = FileManager.default
              var current: Track? { tracks.first { $0.id == currentID } }
              init() {
                  root = FileManager.default.urls(for: .applicationSupportDirectory, in: .userDomainMask)[0].appendingPathComponent("AuralLibrary", isDirectory: true)
                  do {
                      try fm.createDirectory(at: root, withIntermediateDirectories: true)
                      let index = root.appendingPathComponent("library.json")
                      if fm.fileExists(atPath: index.path) { tracks = try JSONDecoder().decode([Track].self, from: Data(contentsOf: index)) }
                  } catch { message = "Library could not be opened: \(error.localizedDescription)" }
                  timeObserver = player.addPeriodicTimeObserver(forInterval: CMTime(seconds: 0.25, preferredTimescale: 600), queue: .main) { [weak self] time in
                      Task { @MainActor in
                          guard let self else { return }
                          self.elapsed = time.seconds.isFinite ? max(0,time.seconds) : 0
                          if let value = self.player.currentItem?.duration.seconds, value.isFinite, value > 0 { self.duration = value }
                      }
                  }
                  endObserver = NotificationCenter.default.addObserver(forName: .AVPlayerItemDidPlayToEndTime, object: nil, queue: .main) { [weak self] note in
                      Task { @MainActor in
                          guard let self, (note.object as? AVPlayerItem) === self.player.currentItem else { return }
                          if self.repeatOne { self.seek(0); self.player.play() } else { self.advance(1, automatic: true) }
                      }
                  }
                  failureObserver = NotificationCenter.default.addObserver(forName: .AVPlayerItemFailedToPlayToEndTime, object: nil, queue: .main) { [weak self] note in
                      Task { @MainActor in
                          guard let self, (note.object as? AVPlayerItem) === self.player.currentItem else { return }
                          self.player.pause(); self.message = "Playback failed. Try another track."
                      }
                  }
                  stateObserver = player.observe(\.timeControlStatus, options: [.initial,.new]) { [weak self] _,_ in
                      Task { @MainActor in
                          guard let self else { return }
                          self.playing = self.player.timeControlStatus == .playing
                          self.updateSystem()
                      }
                  }
                  let remote = MPRemoteCommandCenter.shared()
                  remote.playCommand.addTarget { [weak self] _ in Task { @MainActor in self?.resume() }; return .success }
                  remote.pauseCommand.addTarget { [weak self] _ in Task { @MainActor in self?.player.pause() }; return .success }
                  remote.nextTrackCommand.addTarget { [weak self] _ in Task { @MainActor in self?.advance(1) }; return .success }
                  remote.previousTrackCommand.addTarget { [weak self] _ in Task { @MainActor in self?.advance(-1) }; return .success }
                  remote.changePlaybackPositionCommand.addTarget { [weak self] event in
                      guard let event = event as? MPChangePlaybackPositionCommandEvent else { return .commandFailed }
                      let seconds = event.positionTime
                      Task { @MainActor in self?.seek(seconds) }; return .success
                  }
              }
              func save() { do { try JSONEncoder().encode(tracks).write(to: root.appendingPathComponent("library.json"), options: .atomic) } catch { message = "Could not save library: \(error.localizedDescription)" } }
              func artworkURL(_ track: Track) -> URL? { track.artwork.map { root.appendingPathComponent($0) } }
              func importFiles(_ urls: [URL]) async {
                  guard !importing else { return }; importing = true; defer { importing = false }
                  let base = root
                  var errors: [String] = []
                  for url in urls {
                      do {
                          let track = try await Task.detached(priority: .userInitiated) { try await Self.readFile(url, into: base) }.value
                          tracks.append(track); save()
                      } catch { errors.append("\(url.lastPathComponent): \(error.localizedDescription)") }
                  }
                  if !errors.isEmpty { message = errors.joined(separator: "\n") }
              }
              nonisolated private static func readFile(_ url: URL, into root: URL) async throws -> Track {
                  let fm = FileManager.default
                  let access = url.startAccessingSecurityScopedResource(); defer { if access { url.stopAccessingSecurityScopedResource() } }
                  let id = UUID()
                  let name = id.uuidString + "." + url.pathExtension.lowercased()
                  let destination = root.appendingPathComponent(name)
                  var artName: String?
                  do {
                      var coordinationError: NSError?
                      var copyError: Error?
                      NSFileCoordinator().coordinate(readingItemAt: url, options: [], error: &coordinationError) { readable in
                          do { try fm.copyItem(at: readable, to: destination) } catch { copyError = error }
                      }
                      if let coordinationError { throw coordinationError }; if let copyError { throw copyError }
                      let asset = AVURLAsset(url: destination)
                      let playable = try await asset.load(.isPlayable)
                      let audio = try await asset.loadTracks(withMediaType: .audio)
                      guard playable, !audio.isEmpty else { throw NSError(domain: "Aural", code: 1, userInfo: [NSLocalizedDescriptionKey: "Unsupported audio format or damaged file"]) }
                      let d = try await asset.load(.duration).seconds
                      let metadata = (try? await asset.load(.commonMetadata)) ?? []
                      func value(_ key: AVMetadataKey) async -> String? {
                          guard let item = AVMetadataItem.metadataItems(from: metadata, withKey: key, keySpace: .common).first else { return nil }
                          return try? await item.load(.stringValue)
                      }
                      let filename = url.deletingPathExtension().lastPathComponent
                      let parts = filename.components(separatedBy: " - ")
                      let title = await value(.commonKeyTitle) ?? (parts.count == 2 ? parts[1] : filename)
                      let artist = await value(.commonKeyArtist) ?? (parts.count == 2 ? parts[0] : "Unknown artist")
                      let album = await value(.commonKeyAlbumName) ?? "Unknown album"
                      if let item = AVMetadataItem.metadataItems(from: metadata, withKey: AVMetadataKey.commonKeyArtwork, keySpace: .common).first,
                         let data = try? await item.load(.dataValue), data.count <= 20_000_000 {
                          // Downsample off the main actor using ImageIO, not a full-size decoded bitmap.
                          if let jpeg = thumbnail(data) {
                              let art = id.uuidString + ".jpg"
                              try jpeg.write(to: root.appendingPathComponent(art), options: .atomic); artName = art
                          }
                      }
                      return Track(id: id, file: name, title: title, artist: artist, album: album, duration: d.isFinite ? max(0,d) : 0, artwork: artName)
                  } catch { try? fm.removeItem(at: destination); if let artName { try? fm.removeItem(at: root.appendingPathComponent(artName)) }; throw error }
              }
              nonisolated private static func thumbnail(_ data: Data) -> Data? {
                  guard let source = CGImageSourceCreateWithData(data as CFData, nil), let image = CGImageSourceCreateThumbnailAtIndex(source, 0, [kCGImageSourceCreateThumbnailFromImageAlways: true, kCGImageSourceThumbnailMaxPixelSize: 1000, kCGImageSourceCreateThumbnailWithTransform: true] as CFDictionary) else { return nil }
                  let output = NSMutableData()
                  guard let dest = CGImageDestinationCreateWithData(output, UTType.jpeg.identifier as CFString, 1, nil) else { return nil }
                  CGImageDestinationAddImage(dest, image, [kCGImageDestinationLossyCompressionQuality: 0.88] as CFDictionary)
                  guard CGImageDestinationFinalize(dest) else { return nil }; return output as Data
              }
              func play(_ track: Track, in list: [Track]) {
                  queue = list.map(\.id); if shuffle { queue = [track.id] + queue.filter { $0 != track.id }.shuffled() }; load(track)
              }
              private func load(_ track: Track) {
                  do { try AVAudioSession.sharedInstance().setCategory(.playback, mode: .default); try AVAudioSession.sharedInstance().setActive(true) }
                  catch { message = error.localizedDescription; return }
                  player.pause(); currentID = track.id; elapsed = 0; duration = track.duration
                  let item = AVPlayerItem(url: root.appendingPathComponent(track.file)); player.replaceCurrentItem(with: item)
                  itemObserver = item.observe(\.status, options: [.initial,.new]) { [weak self] item, _ in
                      Task { @MainActor in
                          guard let self, self.player.currentItem === item else { return }
                          if item.status == .failed { self.player.pause(); self.message = item.error?.localizedDescription ?? "Unable to play this file." }
                      }
                  }
                  player.play(); updateSystem()
              }
              func resume() { guard currentID != nil else { return }; do { try AVAudioSession.sharedInstance().setActive(true); player.play() } catch { message = error.localizedDescription } }
              func toggle() { if player.rate != 0 { player.pause() } else { resume() } }
              func seek(_ seconds: Double) { guard duration > 0, seconds.isFinite else { return }; let time = min(duration,max(0,seconds)); player.seek(to: CMTime(seconds: time, preferredTimescale: 600)); elapsed = time; updateSystem() }
              func advance(_ direction: Int, automatic: Bool = false) {
                  guard let currentID, let index = queue.firstIndex(of: currentID) else { return }
                  if direction < 0, elapsed > 3 { seek(0); return }
                  let next = index + direction
                  if !queue.indices.contains(next) { if automatic { player.pause(); seek(0) }; return }
                  if let track = tracks.first(where: { $0.id == queue[next] }) { load(track) }
              }
              func favorite(_ track: Track) { if let index = tracks.firstIndex(where: { $0.id == track.id }) { tracks[index].favorite.toggle(); save() } }
              func remove(_ track: Track) {
                  if currentID == track.id { player.pause(); player.replaceCurrentItem(with: nil); currentID = nil; elapsed = 0; duration = 0; MPNowPlayingInfoCenter.default().nowPlayingInfo = nil }
                  queue.removeAll { $0 == track.id }; tracks.removeAll { $0.id == track.id }; save()
                  try? fm.removeItem(at: root.appendingPathComponent(track.file)); if let art = artworkURL(track) { try? fm.removeItem(at: art) }
              }
              func toggleShuffle() {
                  shuffle.toggle(); guard let currentID else { return }
                  if shuffle { queue = [currentID] + queue.filter { $0 != currentID }.shuffled() }
                  else { let ids = Set(queue); queue = tracks.filter { ids.contains($0.id) }.map(\.id) }
              }
              private func updateSystem() {
                  guard let current else { return }
                  var info: [String: Any] = [MPMediaItemPropertyTitle: current.title, MPMediaItemPropertyArtist: current.artist, MPMediaItemPropertyAlbumTitle: current.album, MPMediaItemPropertyPlaybackDuration: duration, MPNowPlayingInfoPropertyElapsedPlaybackTime: elapsed, MPNowPlayingInfoPropertyPlaybackRate: playing ? 1.0 : 0.0]
                  // Reuse already registered artwork when the song does not change.
                  let center = MPNowPlayingInfoCenter.default()
                  if center.nowPlayingInfo?[MPMediaItemPropertyTitle] as? String == current.title, let art = center.nowPlayingInfo?[MPMediaItemPropertyArtwork] { info[MPMediaItemPropertyArtwork] = art }
                  else if let url = artworkURL(current), let image = UIImage(contentsOfFile: url.path) { info[MPMediaItemPropertyArtwork] = MPMediaItemArtwork(boundsSize: image.size) { _ in image } }
                  center.nowPlayingInfo = info
              }
          }
          
          @main struct AuralApp: App {
              @StateObject private var store = MusicStore()
              var body: some Scene { WindowGroup { RootView().environmentObject(store).preferredColorScheme(.dark) } }
          }
          
          struct Cover: View {
              let url: URL?
              var body: some View {
                  GeometryReader { geo in
                      ZStack {
                          RoundedRectangle(cornerRadius: 12).fill(Color(red: 0.15, green: 0.22, blue: 0.24))
                          if let url, let image = UIImage(contentsOfFile: url.path) { Image(uiImage: image).resizable().scaledToFill() }
                          else { Image(systemName: "music.note").font(.system(size: max(15, geo.size.width * 0.27))).foregroundStyle(.mint.opacity(0.7)) }
                      }.frame(width: geo.size.width, height: geo.size.height).clipped().clipShape(RoundedRectangle(cornerRadius: 12))
                  }
              }
          }
          
          struct RootView: View {
              @EnvironmentObject var store: MusicStore
              @State private var tab = 0
              @State private var category = "Albums"
              @State private var search = ""
              @State private var showFiles = false
              @State private var showPlayer = false
              var filtered: [Track] { store.tracks.filter { (tab != 1 || $0.favorite) && (search.isEmpty || "\($0.title) \($0.artist) \($0.album)".localizedCaseInsensitiveContains(search)) } }
              var body: some View {
                  TabView(selection: $tab) {
                      NavigationStack { library }.tabItem { Label("Library", systemImage: "books.vertical") }.tag(0)
                      NavigationStack { trackList(filtered).navigationTitle("Favorites") }.tabItem { Label("Favorites", systemImage: "heart") }.tag(1)
                      NavigationStack { Form { Section("Aural Native") { Text("Version 0.1 · Cloud build"); Text("Local playback · No accounts or streaming"); Text("Files are copied into Aural's private storage. Keep your originals.") }; Section("Library") { Text("\(store.tracks.count) tracks"); Button("Add music") { showFiles = true } } }.navigationTitle("Settings") }.tabItem { Label("Settings", systemImage: "gearshape") }.tag(2)
                  }
                  .tint(.mint)
                  .tabViewBottomAccessory(isEnabled: store.current != nil) { if let track = store.current { mini(track) } }
                  .fileImporter(isPresented: $showFiles, allowedContentTypes: [.audio], allowsMultipleSelection: true) { result in
                      switch result { case .success(let urls): Task { await store.importFiles(urls) }; case .failure(let error): store.message = error.localizedDescription }
                  }
                  .sheet(isPresented: $showPlayer) { PlayerView(progress: store.clock).environmentObject(store) }
                  .alert("Aural", isPresented: Binding(get: { store.message != nil }, set: { if !$0 { store.message = nil } })) { Button("OK") { store.message = nil } } message: { Text(store.message ?? "") }
              }
              var library: some View {
                  VStack(spacing: 0) {
                      Picker("Library view", selection: $category) { ForEach(["Albums","Artists","Songs"], id: \.self) { Text($0) } }.pickerStyle(.segmented).padding(.horizontal).padding(.vertical, 8)
                      if store.importing { ProgressView("Importing music…").padding(6) }
                      if filtered.isEmpty { ContentUnavailableView("No music", systemImage: "music.note.list", description: Text("Add audio files from Files to get started.")) }
                      else if category == "Songs" { trackList(filtered) }
                      else { groups }
                  }.navigationTitle("Library").searchable(text: $search, prompt: "Search your music").toolbar { ToolbarItem(placement: .topBarTrailing) { Button { showFiles = true } label: { Label("Add music", systemImage: "plus") }.disabled(store.importing) } }
              }
              var groups: some View {
                  let grouped = Dictionary(grouping: filtered) { track in category == "Artists" ? track.artist : (track.album == "Unknown album" ? track.title + " · " + track.artist : track.album + " · " + track.artist) }
                  return ScrollView { LazyVGrid(columns: [GridItem(.adaptive(minimum: 148), spacing: 14)], spacing: 18) {
                      ForEach(grouped.keys.sorted(), id: \.self) { key in
                          if let songs = grouped[key], let first = songs.first {
                              NavigationLink { trackList(songs).navigationTitle(category == "Artists" ? first.artist : (first.album == "Unknown album" ? first.title : first.album)) } label: {
                                  VStack(alignment: .leading, spacing: 5) { Cover(url: store.artworkURL(first)).aspectRatio(1, contentMode: .fit); Text(category == "Artists" ? first.artist : (first.album == "Unknown album" ? first.title : first.album)).font(.headline).lineLimit(2); Text(category == "Artists" ? "\(songs.count) songs" : first.artist).font(.subheadline).foregroundStyle(.secondary).lineLimit(1) }.foregroundStyle(.primary)
                              }.buttonStyle(.plain)
                          }
                      }
                  }.padding() }
              }
              func trackList(_ songs: [Track]) -> some View {
                  List(songs) { track in
                      Button { store.play(track, in: songs) } label: {
                          HStack(spacing: 12) { Cover(url: store.artworkURL(track)).frame(width: 46,height: 46); VStack(alignment: .leading, spacing: 4) { Text(track.title).foregroundStyle(.primary).lineLimit(1); Text(track.artist).font(.subheadline).foregroundStyle(.secondary).lineLimit(1) }; Spacer(); if store.currentID == track.id { Image(systemName: "waveform").foregroundStyle(.mint) } }
                      }.buttonStyle(.plain).swipeActions { Button { store.favorite(track) } label: { Label("Favorite", systemImage: track.favorite ? "heart.slash" : "heart") }.tint(.mint) }.contextMenu { Button { store.favorite(track) } label: { Label(track.favorite ? "Remove favorite" : "Favorite", systemImage: "heart") }; Button(role: .destructive) { store.remove(track) } label: { Label("Remove from Aural", systemImage: "trash") } }
                  }.listStyle(.plain)
              }
              func mini(_ track: Track) -> some View {
                  HStack(spacing: 10) {
                      Button { showPlayer = true } label: { HStack(spacing: 10) { Cover(url: store.artworkURL(track)).frame(width: 40,height: 40); VStack(alignment: .leading,spacing: 3) { Text(track.title).font(.subheadline.weight(.semibold)).lineLimit(1); Text(track.artist).font(.caption).foregroundStyle(.secondary).lineLimit(1) }; Spacer(minLength: 0) }.foregroundStyle(.primary) }.buttonStyle(.plain)
                      Button { store.toggle() } label: { Image(systemName: store.playing ? "pause.fill" : "play.fill").frame(width:44,height:44) }.accessibilityLabel(store.playing ? "Pause" : "Play")
                      Button { store.advance(1) } label: { Image(systemName: "forward.end.fill").frame(width:44,height:44) }.accessibilityLabel("Next track")
                  }.padding(.horizontal, 12).foregroundStyle(.primary)
              }
          }
          
          struct PlayerView: View {
              @ObservedObject var progress: PlaybackClock
              @EnvironmentObject var store: MusicStore
              @Environment(\.dismiss) var dismiss
              @State private var dragging = false
              @State private var seekValue = 0.0
              var body: some View {
                  GeometryReader { geo in
                      if let track = store.current {
                          ScrollView {
                              VStack(spacing: 20) {
                                  HStack { Button { dismiss() } label: { Image(systemName: "chevron.down").frame(width:44,height:44) }.accessibilityLabel("Close player"); Spacer(); Text("NOW PLAYING").font(.caption.weight(.semibold)).tracking(2).foregroundStyle(.secondary); Spacer(); Color.clear.frame(width:44,height:44) }
                                  Cover(url: store.artworkURL(track)).frame(width: min(geo.size.width - 48, geo.size.height * 0.47), height: min(geo.size.width - 48, geo.size.height * 0.47))
                                  HStack { VStack(alignment: .leading,spacing: 5) { Text(track.title).font(.title2.bold()).lineLimit(2); Text(track.artist).font(.title3).foregroundStyle(.secondary); Text(track.format).font(.footnote.weight(.medium)).foregroundStyle(.mint) }; Spacer(); Button { store.favorite(track) } label: { Image(systemName: track.favorite ? "heart.fill" : "heart").font(.title2).frame(width:44,height:44) }.accessibilityLabel("Favorite") }
                                  Slider(value: Binding(get: { dragging ? seekValue : min(progress.elapsed,max(progress.duration,1)) }, set: { seekValue = $0 }), in: 0...max(progress.duration,1), onEditingChanged: { active in if active { seekValue = progress.elapsed; dragging = true } else { store.seek(seekValue); dragging = false } }).accessibilityLabel("Playback position")
                                  HStack { Text(clock(dragging ? seekValue : progress.elapsed)); Spacer(); Text(clock(progress.duration)) }.font(.caption.monospacedDigit()).foregroundStyle(.secondary)
                                  HStack { Button { store.toggleShuffle() } label: { Image(systemName: "shuffle").frame(width:44,height:44).foregroundStyle(store.shuffle ? Color.mint : Color.primary) }.accessibilityLabel("Shuffle"); Spacer(); Button { store.advance(-1) } label: { Image(systemName: "backward.end.fill").font(.title2).frame(width:44,height:44) }.accessibilityLabel("Previous"); Spacer(); Button { store.toggle() } label: { Image(systemName: store.playing ? "pause.fill" : "play.fill").font(.system(size:28,weight:.semibold)).frame(width:72,height:72).background(.white,in: Circle()).foregroundStyle(.black) }.accessibilityLabel(store.playing ? "Pause" : "Play"); Spacer(); Button { store.advance(1) } label: { Image(systemName: "forward.end.fill").font(.title2).frame(width:44,height:44) }.accessibilityLabel("Next"); Spacer(); Button { store.repeatOne.toggle() } label: { Image(systemName: store.repeatOne ? "repeat.1" : "repeat").frame(width:44,height:44).foregroundStyle(store.repeatOne ? Color.mint : Color.primary) }.accessibilityLabel("Repeat one") }
                              }.frame(maxWidth: 520).padding(20).frame(maxWidth: .infinity)
                          }.scrollBounceBehavior(.basedOnSize)
                      } else { ContentUnavailableView("Nothing playing", systemImage: "music.note") }
                  }.background(Color(red: 0.07,green: 0.08,blue: 0.09).ignoresSafeArea()).tint(.mint)
              }
              func clock(_ value: Double) -> String { let s = Int(max(0,min(value.isFinite ? value : 0, 999999))); return String(format: "%d:%02d",s/60,s%60) }
          }
          AURAL_SOURCE
          cat > project.yml <<'AURAL_SOURCE'
          name: Aural
          options:
            bundleIdPrefix: local.aural
            deploymentTarget:
              iOS: '26.1'
          targets:
            Aural:
              type: application
              platform: iOS
              sources: [Aural]
              info:
                path: AuralInfo.plist
                properties:
                  CFBundleDisplayName: Aural
                  UILaunchScreen: {}
                  UIBackgroundModes: [audio]
                  UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
                  UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: local.aural.player
                  MARKETING_VERSION: '0.1.0'
                  CURRENT_PROJECT_VERSION: '1'
                  SWIFT_VERSION: '5.0'
                  TARGETED_DEVICE_FAMILY: '1,2'
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  CODE_SIGNING_ALLOWED: NO
              scheme:
                gatherCoverageData: false
          AURAL_SOURCE
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodebuild -version
          xcodegen generate
          xcodebuild -project Aural.xcodeproj -scheme Aural -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/DerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          APP="$PWD/DerivedData/Build/Products/Release-iphoneos/Aural.app"
          test -f "$APP/Aural"
          mkdir -p "$GITHUB_WORKSPACE/output/Payload"
          ditto "$APP" "$GITHUB_WORKSPACE/output/Payload/Aural.app"
          cd "$GITHUB_WORKSPACE/output"
          zip -qry Aural-unsigned.ipa Payload
          unzip -tq Aural-unsigned.ipa
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Aural-Native-unsigned
          path: output/Aural-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
